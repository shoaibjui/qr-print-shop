<!doctype html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Print Shop Admin</title>
<style>
body{margin:0;background:#f4f6fa;color:#172033;font-family:system-ui,Arial,sans-serif}main{max-width:1000px;margin:24px auto;padding:14px}.card{background:white;border:1px solid #e4e7ec;border-radius:14px;padding:18px;margin-bottom:16px}input,button,select{font:inherit;padding:10px;border:1px solid #ccd2dc;border-radius:8px}input{display:block;width:100%;margin:8px 0}button{background:#155eef;color:white;border:0;margin:4px;cursor:pointer}button.secondary{background:#475467}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:10px;border-bottom:1px solid #eaecf0;text-align:right;font-size:14px} .scroll{overflow:auto}.muted{color:#667085;font-size:13px}#orders{display:none}.status{font-weight:700}
</style></head><body><main><h1>QR Print Shop — ایڈمن پینل</h1>
<section class="card" id="loginBox"><h2>مالک کا لاگ اِن</h2><p class="muted">یہاں صرف دکان کے مالک کا Supabase Auth اکاؤنٹ استعمال کریں۔</p><input id="email" type="email" placeholder="مالک کا ای میل"><input id="password" type="password" placeholder="پاس ورڈ"><button id="login">لاگ اِن</button><div id="loginMsg"></div></section>
<section id="orders"><div class="card"><button id="refresh">آرڈرز تازہ کریں</button><button class="secondary" id="logout">لاگ آؤٹ</button><p class="muted">فائل دیکھنے کے لیے Download دبائیں۔ منظور کرنے سے پہلے ادائیگی اپنے JazzCash/Easypaisa/بینک اکاؤنٹ میں لازماً چیک کریں۔</p></div><div class="card scroll"><table><thead><tr><th>آرڈر</th><th>گاہک</th><th>تفصیل</th><th>ادائیگی</th><th>رقم</th><th>حالت</th><th>عمل</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const cfg=window.QR_PRINT_CONFIG||{},client=window.supabase.createClient(cfg.url||'https://example.supabase.co',cfg.anonKey||'placeholder');
const $=id=>document.getElementById(id);
async function load(){const {data,error}=await client.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(error){$('loginMsg').textContent=error.message;return;}$('rows').innerHTML='';for(const o of data){const tr=document.createElement('tr');const details=`${o.paper_size} · ${o.print_type==='color'?'رنگین':'B&W'} · ${o.pages} صفحات × ${o.copies}`;tr.innerHTML=`<td>${o.id}</td><td>${escapeHtml(o.customer_name)}<br>${escapeHtml(o.phone)}</td><td>${details}</td><td>${escapeHtml(o.payment_method)}<br>${escapeHtml(o.transaction_id)}</td><td>${o.amount} روپے</td><td class="status">${escapeHtml(o.status)}</td><td><button data-file="${o.file_path}">فائل</button>${o.receipt_path?`<button class="secondary" data-file="${o.receipt_path}">رسید</button>`:''}<button data-status="approved" data-id="${o.id}">منظور</button><button class="secondary" data-status="rejected" data-id="${o.id}">مسترد</button><button class="secondary" data-status="printed" data-id="${o.id}">پرنٹ مکمل</button></td>`;$('rows').appendChild(tr);}}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('login').onclick=async()=>{const {error}=await client.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'لاگ اِن ہوگیا';if(!error){$('loginBox').style.display='none';$('orders').style.display='block';load();}};
$('refresh').onclick=load;$('logout').onclick=async()=>{await client.auth.signOut();location.reload();};
$('rows').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.file){const {data,error}=await client.storage.from('print-files').createSignedUrl(b.dataset.file,300);if(error)alert(error.message);else window.open(data.signedUrl,'_blank');}if(b.dataset.status){const {error}=await client.from('orders').update({status:b.dataset.status}).eq('id',b.dataset.id);if(error)alert(error.message);else load();}};
client.auth.getSession().then(({data})=>{if(data.session){$('loginBox').style.display='none';$('orders').style.display='block';load();}});
</script></body></html>
