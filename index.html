<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USMANI PRINT - عثمانی پرنٹ</title>

<!-- PWA SETTINGS -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#126b3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="USMANI PRINT">
<link rel="apple-touch-icon" href="./icon-192.png">

<style>
:root{
 --green:#126b3a;--blue:#0756b9;--ink:#172033;
 --bg:#f4f6fa;--border:#d9e0ea;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--ink);
 font-family:Arial,system-ui,sans-serif
}
header{
 width:100%;background:#fff;line-height:0;
 text-align:center;padding:8px 12px;
 border-bottom:1px solid #e5eaf0;
}
header img{
 display:block;width:100%;max-width:1100px;
 height:auto;max-height:220px;object-fit:contain;margin:0 auto;
}
#installAppBtn{
 display:none;border:0;border-radius:9px;
 background:var(--green);color:white;
 padding:11px 20px;font-weight:bold;
 font-size:15px;cursor:pointer
}
#installAppBtn.show{display:inline-block}
.lang{
 display:flex;flex-direction:row;direction:ltr;
 justify-content:center;gap:8px;margin:10px auto
}
.lang button{
 border:1px solid var(--green);background:white;
 color:var(--green);padding:8px 20px;border-radius:8px;
 font-weight:bold;cursor:pointer
}
.lang button.active{background:var(--green);color:white}
main{max-width:620px;margin:12px auto;padding:0 12px 25px}
.card{
 background:white;border:1px solid var(--border);
 border-radius:13px;padding:16px;
 box-shadow:0 3px 12px #1720330c;margin-bottom:14px
}
h2{
 margin:0 0 15px;font-size:22px;text-align:center;
 font-weight:bold;
 background:linear-gradient(90deg,#126b3a,#d49b18,#126b3a);
 -webkit-background-clip:text;background-clip:text;
 color:transparent;animation:welcomeBlink 1.5s ease-in-out infinite
}
@keyframes welcomeBlink{
 0%,100%{opacity:1}
 50%{opacity:.45}
}
label{display:block;margin:12px 0 6px;font-weight:bold;font-size:14px}
input,select{
 width:100%;padding:12px;border:1px solid var(--border);
 border-radius:8px;background:white;font-size:15px;color:var(--ink)
}
input[type=file]{padding:9px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pricebox{
 background:#f0f6ff;border:1px solid #c6daf5;
 padding:10px 12px;border-radius:8px;margin-top:10px;text-align:center
}
.price{
 font-size:21px;font-weight:700;color:var(--blue);
 direction:inherit;line-height:1.5
}
.payment-box{
 display:none;background:#eef7f1;border:1px solid #b8dfc4;
 border-radius:8px;padding:12px 10px;margin-top:8px;
 text-align:center;line-height:1.5
}
.payment-heading{
 display:flex;align-items:center;justify-content:center;
 gap:10px;flex-wrap:wrap;font-weight:bold;font-size:15px;margin-bottom:8px
}
.payment-logo{
 display:block;width:110px;height:42px;object-fit:contain;
 background:white;border-radius:7px;padding:4px 7px
}
.payment-number{
 font-size:20px;font-weight:bold;color:var(--green);
 direction:ltr;margin:6px 0
}
.payment-message{
 font-size:12px;color:#d00000;font-weight:bold;line-height:1.7
}
