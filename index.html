
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USMANI PRINT - عثمانی پرنٹ</title>

<style>
:root{
  --green:#126b3a;
  --ink:#172033;
  --bg:#f4f6fa;
  --border:#d9e0ea;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:Arial,system-ui,sans-serif;
}
header{
  width:100%;
  background:#fff;
  line-height:0;
  text-align:center;
}
header img{
  display:block;
  width:100%;
  height:auto;
  background:#fff;
}

/* Language buttons: fixed position */
.lang{
  display:flex;
  flex-direction:row;
  direction:ltr;
  justify-content:center;
  gap:8px;
  margin:10px auto;
}
.lang button{
  border:1px solid var(--green);
  background:white;
  color:var(--green);
  padding:8px 20px;
  border-radius:8px;
  font-weight:bold;
}
.lang button.active{
  background:var(--green);
  color:white;
}

main{
  max-width:620px;
  margin:12px auto;
  padding:0 12px 25px;
}
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:16px;
  box-shadow:0 3px 12px #1720330c;
}

/* Welcome heading */
h2{
  margin:0 0 15px;
  font-size:22px;
  text-align:center;
  font-weight:bold;
  background:linear-gradient(90deg,#126b3a,#d49b18,#126b3a);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:welcomeBlink 1.5s ease-in-out infinite;
}
@keyframes welcomeBlink{
  0%,100%{opacity:1}
  50%{opacity:.45}
}

label{
  display:block;
  margin:12px 0 6px;
  font-weight:bold;
  font-size:14px;
}
input,select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  border-radius:8px;
  background:white;
  font-size:15px;
  color:var(--ink);
}
input[type=file]{padding:9px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* Professional total amount */
.pricebox{
  background:#f0f8f2;
  border:1px solid #c7e3cf;
  padding:10px 12px;
  border-radius:8px;
  margin-top:10px;
  text-align:center;
}
.price{
  font-size:21px;
  font-weight:700;
  color:var(--green);
  direction:inherit;
  line-height:1.5;
}

/* Compact Payment Box */
.payment-box{
  display:none;
  background:#eef7f1;
  border:1px solid #b8dfc4;
  border-radius:8px;
  padding:7px 10px;
  margin-top:8px;
  text-align:center;
  line-height:1.5;
  font-size:12px;
}
.payment-number{
  font-size:18px;
  font-weight:bold;
  color:#126b3a;
  direction:ltr;
  margin:2px 0;
}
.payment-message{
  font-size:11px;
  color:#344054;
  font-weight:normal;
  line-height:1.4;
}

.preview{
  display:none;
  background:#f7f9fc;
  border:1px solid #d9e0ea;
  border-radius:10px;
  padding:12px;
  margin-top:12px;
  text-align:center;
}
.preview-title{
  font-weight:bold;
  margin-bottom:8px;
}
.preview img{
  display:block;
  max-width:100%;
  max-height:450px;
  width:auto;
  height:auto;
  object-fit:contain;
  margin:0 auto;
  background:white;
  border:1px solid #ddd;
}
.preview iframe{
  width:100%;
  height:420px;
  border:1px solid #ddd;
  border-radius:6px;
  background:white;
}
.file-details{
  font-size:12px;
  color:#667085;
  margin-top:8px;
  direction:ltr;
  overflow-wrap:anywhere;
}
.notice{
  font-size:13px;
  color:#667085;
  line-height:1.7;
  margin-top:10px;
}
.submit{
  width:100%;
  border:0;
  border-radius:9px;
  background:var(--green);
  color:white;
  padding:14px;
  font-size:17px;
  font-weight:bold;
  margin-top:16px;
}
.submit:disabled{opacity:.6}
.result{
  display:none;
  margin-top:15px;
  border:1px solid #9bd5ad;
  background:#effaf2;
  color:#14532d;
  border-radius:10px;
  padding:14px;
  text-align:center;
  line-height:1.9;
  overflow-wrap:anywhere;
}
footer{
  text-align:center;
  padding:15px;
  color:#667085;
  font-size:12px;
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
  .card{padding:13px}
  h2{font-size:19px}
  .price{font-size:19px}
}
</style>
</head>

<body>

<header>
  <img src="usmani-print-logo-2.png" alt="USMANI PRINT">
</header>

<!-- English ہمیشہ بائیں، اردو ہمیشہ دائیں -->
<div class="lang" dir="ltr">
  <button type="button" id="englishBtn"
          onclick="setLanguage('en')">English</button>

  <button type="button" id="urduBtn"
          class="active" onclick="setLanguage('ur')">اردو</button>
</div>

<main>
<section class="card">

<h2 id="formTitle">السلام علیکم! ہماری ویب سائٹ پر آنے پر خوش آمدید 🌹</h2>

<form id="orderForm">

<label id="nameLabel" for="customer_name">آپ کا نام</label>
<input id="customer_name" name="customer_name"
       type="text" required maxlength="100"
       placeholder="اپنا نام لکھیں">

<label id="phoneLabel" for="phone">موبائل نمبر</label>
<input id="phone" name="phone"
       type="tel" required maxlength="20"
       placeholder="03XXXXXXXXX">

<label id="fileLabel" for="printFile">پرنٹ کی فائل منتخب کریں</label>
<input id="printFile" name="printFile"
       type="file" accept=".pdf,.jpg,.jpeg,.png" required>

<div class="notice" id="fileNote">
  صرف PDF، JPG یا PNG فائل منتخب کریں۔ زیادہ سے زیادہ 20MB۔
</div>

<div class="preview" id="filePreview">
  <div class="preview-title" id="previewTitle">فائل کا پریویو</div>
  <img id="imagePreview" alt="File Preview" style="display:none">
  <iframe id="pdfPreview" title="PDF Preview" style="display:none"></iframe>
  <div class="file-details" id="fileDetails"></div>
</div>

<div class="grid">
  <div>
    <label id="paperLabel" for="paper_size">پیپر سائز</label>
    <select id="paper_size" name="paper_size" required>
      <option value="A4">A4</option>
      <option value="Legal">Legal (8.5 × 14)</option>
    </select>
  </div>

  <div>
    <label id="typeLabel" for="print_type">پرنٹ کی قسم</label>
    <select id="print_type" name="print_type" required>
      <option value="bw">بلیک اینڈ وائٹ</option>
      <option value="color">کلر</option>
    </select>
  </div>
</div>

<div class="grid">
  <div>
    <label id="pagesLabel" for="pages">صفحات کی تعداد</label>
    <input id="pages" name="pages" type="number"
           min="1" max="500" value="1" required>
  </div>

  <div>
    <label id="copiesLabel" for="copies">کاپیوں کی تعداد</label>
    <input id="copies" name="copies" type="number"
           min="1" max="100" value="1" required>
  </div>
</div>

<div class="pricebox">
  <div class="price" id="totalAmount">کل رقم: 20 روپے</div>
</div>

<label id="paymentLabel" for="payment_method">ادائیگی کا طریقہ</label>
<select id="payment_method" name="payment_method" required>
  <option value="JazzCash">JazzCash</option>
  <option value="Easypaisa">Easypaisa</option>
</select>

<div class="payment-box" id="paymentBox">
  <strong id="accountTitle">JazzCash اکاؤنٹ نمبر</strong>
  <div class="payment-number" id="accountNumber">03065612619</div>
  <div class="payment-message" id="paymentMessage">
    ادائیگی کی تصدیق کے بعد آرڈر منظور کیا جائے گا۔
  </div>
</div>

<label id="transactionLabel" for="transaction_id">ٹرانزیکشن آئی ڈی</label>
<input id="transaction_id" name="transaction_id"
       type="text" required maxlength="100"
       placeholder="ٹرانزیکشن آئی ڈی درج کریں">

<label id="receiptLabel" for="receiptFile">
  ادائیگی کی رسید (اختیاری)
</label>
<input id="receiptFile" name="receiptFile"
       type="file" accept=".jpg,.jpeg,.png">

<div class="notice" id="receiptNote">
  رسید کی تصویر JPG یا PNG میں اپ لوڈ کرسکتے ہیں۔
</div>

<button class="submit" id="submitBtn" type="submit">
  آرڈر جمع کریں
</button>

</form>

<div class="result" id="resultBox"></div>

</section>
</main>

<footer>USMANI PRINT © 2026</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
const MAX_FILE_SIZE=20*1024*1024;

const translations={
ur:{
 formTitle:"السلام علیکم! ہماری ویب سائٹ پر آنے پر خوش آمدید 🌹",
 nameLabel:"آپ کا نام",
 namePlaceholder:"اپنا نام لکھیں",
 phoneLabel:"موبائل نمبر",
 phonePlaceholder:"03XXXXXXXXX",
 fileLabel:"پرنٹ کی فائل منتخب کریں",
 fileNote:"صرف PDF، JPG یا PNG فائل۔ زیادہ سے زیادہ سائز 20MB۔",
 previewTitle:"فائل کا پریویو",
 paperLabel:"پیپر سائز",
 typeLabel:"پرنٹ کی قسم",
 bw:"بلیک اینڈ وائٹ",
 color:"کلر",
 pagesLabel:"صفحات کی تعداد",
 copiesLabel:"کاپیوں کی تعداد",
 totalLabel:"کل رقم:",
 paymentLabel:"ادائیگی کا طریقہ",
 accountTitle:"اکاؤنٹ نمبر",
 paymentMessage:"ادائیگی کی تصدیق کے بعد آرڈر منظور کیا جائے گا۔",
 transactionLabel:"ٹرانزیکشن آئی ڈی",
 transactionPlaceholder:"ٹرانزیکشن آئی ڈی درج کریں",
 receiptLabel:"ادائیگی کی رسید (اختیاری)",
 receiptNote:"رسید کی تصویر JPG یا PNG میں اپ لوڈ کرسکتے ہیں۔",
 submitBtn:"آرڈر جمع کریں",
 uploading:"آرڈر جمع ہو رہا ہے، انتظار کریں...",
 success:"آپ کا آرڈر کامیابی سے جمع ہوگیا!",
 orderNo:"آرڈر نمبر",
 amount:"تخمینی رقم",
 save:"اس آرڈر نمبر کو محفوظ رکھیں۔",
 error:"خرابی",
 invalid:"براہ کرم تمام معلومات درست درج کریں۔",
 fileError:"فائل PDF، JPG یا PNG ہو اور 20MB سے زیادہ نہ ہو۔",
 receiptError:"رسید JPG یا PNG ہونی چاہیے اور 20MB سے زیادہ نہ ہو۔",
 rupee:"روپے"
},
en:{
 formTitle:"Welcome to Our Website! 🌹",
 nameLabel:"Your Name",
 namePlaceholder:"Enter your name",
 phoneLabel:"Mobile Number",
 phonePlaceholder:"03XXXXXXXXX",
 fileLabel:"Select Print File",
 fileNote:"PDF, JPG or PNG only. Maximum file size 20MB.",
 previewTitle:"File Preview",
 paperLabel:"Paper Size",
 typeLabel:"Print Type",
 bw:"Black & White",
 color:"Color",
 pagesLabel:"Number of Pages",
 copiesLabel:"Number of Copies",
 totalLabel:"Total Amount:",
 paymentLabel:"Payment Method",
 accountTitle:"Account Number",
 paymentMessage:"The order will be approved after payment verification.",
 transactionLabel:"Transaction ID",
 transactionPlaceholder:"Enter transaction ID",
 receiptLabel:"Payment Receipt (Optional)",
 receiptNote:"You can upload receipt in JPG or PNG format.",
 submitBtn:"Submit Order",
 uploading:"Submitting order, please wait...",
 success:"Your order has been submitted successfully!",
 orderNo:"Order Number",
 amount:"Estimated Amount",
 save:"Please save this order number.",
 error:"Error",
 invalid:"Please enter all information correctly.",
 fileError:"File must be PDF, JPG or PNG and no larger than 20MB.",
 receiptError:"Receipt must be JPG or PNG and no larger than 20MB.",
 rupee:"Rs"
}
};

let currentLanguage="ur";
let client=null;
let previewUrl=null;

function setLanguage(language){
 currentLanguage=language;
 const t=translations[language];

 document.documentElement.lang=language;
 document.documentElement.dir=language==="ur"?"rtl":"ltr";

 const ids=[
 "formTitle","nameLabel","phoneLabel","fileLabel","fileNote",
 "previewTitle","paperLabel","typeLabel","pagesLabel",
 "copiesLabel","paymentLabel","transactionLabel",
 "receiptLabel","receiptNote","submitBtn"
 ];

 ids.forEach(id=>{
   document.getElementById(id).textContent=t[id];
 });

 document.getElementById("customer_name").placeholder=t.namePlaceholder;
 document.getElementById("phone").placeholder=t.phonePlaceholder;
 document.getElementById("transaction_id").placeholder=t.transactionPlaceholder;

 document.querySelector('#print_type option[value="bw"]').textContent=t.bw;
 document.querySelector('#print_type option[value="color"]').textContent=t.color;

 document.getElementById("urduBtn").classList.toggle("active",language==="ur");
 document.getElementById("englishBtn").classList.toggle("active",language==="en");

 updatePaymentInfo();
 updatePrice();
}

function updatePaymentInfo(){
 const method=document.getElementById("payment_method").value;
 const title=document.getElementById("accountTitle");
 const number=document.getElementById("accountNumber");
 const box=document.getElementById("paymentBox");

 box.style.display="block";

 if(method==="JazzCash"){
   title.textContent=currentLanguage==="ur"?"JazzCash اکاؤنٹ نمبر":"JazzCash Account Number";
   number.textContent="03065612619";
 }else{
   title.textContent=currentLanguage==="ur"?"Easypaisa اکاؤنٹ نمبر":"Easypaisa Account Number";
   number.textContent="03337612619";
 }

 document.getElementById("paymentMessage").textContent=
   translations[currentLanguage].paymentMessage;
}

function getRate(type,totalPages){
 if(type==="bw"){
   if(totalPages<=10)return 20;
   if(totalPages<=30)return 15;
   if(totalPages<=60)return 13;
   if(totalPages<=100)return 12;
   return 10;
 }

 if(totalPages<=20)return 40;
 if(totalPages<=50)return 36;
 if(totalPages<=100)return 32;
 return 30;
}

function updatePrice(){
 const pages=parseInt(document.getElementById("pages").value)||1;
 const copies=parseInt(document.getElementById("copies").value)||1;
 const type=document.getElementById("print_type").value;

 const totalPages=pages*copies;
 const rate=getRate(type,totalPages);
 const amount=rate*totalPages;

 const label=currentLanguage==="ur"?"کل رقم: ":"Total Amount: Rs ";

 document.getElementById("totalAmount").textContent=
   label+amount.toLocaleString("en-US")+
   (currentLanguage==="ur"?" روپے":"");

 return amount;
}

document.getElementById("pages").addEventListener("input",updatePrice);
document.getElementById("copies").addEventListener("input",updatePrice);
document.getElementById("print_type").addEventListener("change",updatePrice);
document.getElementById("payment_method").addEventListener("change",updatePaymentInfo);

function extension(file){
 return file.name.split(".").pop().toLowerCase();
}

function validPrintFile(file){
 return ["pdf","jpg","jpeg","png"].includes(extension(file))
   && file.size<=MAX_FILE_SIZE;
}

function validReceipt(file){
 return !file || (
   ["jpg","jpeg","png"].includes(extension(file))
   && file.size<=MAX_FILE_SIZE
 );
}

function showPreview(file){
 const preview=document.getElementById("filePreview");
 const image=document.getElementById("imagePreview");
 const pdf=document.getElementById("pdfPreview");
 const details=document.getElementById("fileDetails");

 if(previewUrl){
   URL.revokeObjectURL(previewUrl);
   previewUrl=null;
 }

 image.style.display="none";
 pdf.style.display="none";
 preview.style.display="none";
 image.src="";
 pdf.src="";

 if(!file)return;

 previewUrl=URL.createObjectURL(file);
 preview.style.display="block";

 details.textContent=file.name+" | "+
   (file.size/1024/1024).toFixed(2)+" MB";

 const ext=extension(file);

 if(ext==="pdf"){
   pdf.src=previewUrl;
   pdf.style.display="block";
 }else{
   image.src=previewUrl;
   image.style.display="block";
   image.style.objectFit="contain";
   image.style.maxWidth="100%";
   image.style.maxHeight="450px";
 }
}

document.getElementById("printFile").addEventListener("change",function(){
 const file=this.files[0];

 if(!file){
   showPreview(null);
   return;
 }

 if(!validPrintFile(file)){
   alert(translations[currentLanguage].fileError);
   this.value="";
   showPreview(null);
   return;
 }

 showPreview(file);
});

function getSupabaseClient(){
 if(client)return client;

 if(!window.supabase || !window.QR_PRINT_CONFIG){
   throw new Error("Supabase یا config.js لوڈ نہیں ہوا۔");
 }

 const cfg=window.QR_PRINT_CONFIG;

 if(!cfg.url || !cfg.anonKey){
   throw new Error("config.js میں Supabase URL یا anonKey موجود نہیں۔");
 }

 client=window.supabase.createClient(cfg.url,cfg.anonKey);
 return client;
}

document.getElementById("orderForm").addEventListener("submit",async function(event){
 event.preventDefault();

 const t=translations[currentLanguage];
 const form=this;
 const btn=document.getElementById("submitBtn");
 const resultBox=document.getElementById("resultBox");

 resultBox.style.display="none";

 const customerName=form.elements.customer_name.value.trim();
 const phone=form.elements.phone.value.trim();
 const file=form.elements.printFile.files[0];
 const receipt=form.elements.receiptFile.files[0]||null;
 const pages=parseInt(form.elements.pages.value);
 const copies=parseInt(form.elements.copies.value);
 const amount=updatePrice();

 if(!customerName || !phone || !file ||
    !form.elements.transaction_id.value.trim() ||
    !Number.isInteger(pages) || pages<1 || pages>500 ||
    !Number.isInteger(copies) || copies<1 || copies>100){
   alert(t.invalid);
   return;
 }

 if(!validPrintFile(file)){
   alert(t.fileError);
   return;
 }

 if(!validReceipt(receipt)){
   alert(t.receiptError);
   return;
 }

 btn.disabled=true;
 btn.textContent=t.uploading;

 try{
   const db=getSupabaseClient();
   const id=crypto.randomUUID();

   const printPath="orders/"+id+"/print."+extension(file);

   const uploadPrint=await db.storage
     .from("print-files")
     .upload(printPath,file,{upsert:false});

   if(uploadPrint.error)throw uploadPrint.error;

   let receiptPath=null;

   if(receipt){
     receiptPath="orders/"+id+"/receipt."+extension(receipt);

     const uploadReceipt=await db.storage
       .from("print-files")
       .upload(receiptPath,receipt,{upsert:false});

     if(uploadReceipt.error)throw uploadReceipt.error;
   }

   const row={
     p_customer_name:customerName,
     p_phone:phone,
     p_file_path:printPath,
     p_paper_size:form.elements.paper_size.value,
     p_print_type:form.elements.print_type.value,
     p_pages:pages,
     p_copies:copies,
     p_payment_method:form.elements.payment_method.value,
     p_transaction_id:form.elements.transaction_id.value.trim(),
     p_receipt_path:receiptPath,
     p_amount:amount
   };

   const result=await db.rpc("create_print_order",row);

   if(result.error)throw result.error;

   const orderNo=result.data;

   resultBox.style.display="block";
   resultBox.innerHTML=
     "<strong>"+t.success+"</strong><br>"+
     t.orderNo+": <b>"+orderNo+"</b><br>"+
     t.amount+": <b>"+amount+" "+t.rupee+"</b><br>"+
     t.save;

   form.reset();
   showPreview(null);
   updatePrice();
   updatePaymentInfo();

 }catch(error){
   console.error(error);
   alert(t.error+": "+(error.message||String(error)));
 }finally{
   btn.disabled=false;
   btn.textContent=translations[currentLanguage].submitBtn;
 }
});

setLanguage("ur");
</script>

</body>
</html>
